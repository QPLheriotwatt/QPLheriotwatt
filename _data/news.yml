- date: 22. August 2025
  headline: "QPL Away Day 2025"
  details: >
    The sun was shining over North Berwick helping to make it a great day learning the ropes of various Scottish Highland Games activities with Wild Cairns… even if some of us took the scoring a bit too seriously!  
    (…Team MacDonald was robbed…!).

- date: 20. June 2025
  headline: "New Assistant Professor!"
  details: >
    Dr. Samer Kurdi has joined us as an Assistant Professor. His focus is on spin and charge mapping in the nanoscale using spins in diamond.  
    A huge welcome to the QPL group, Samer!

- date: 15. December 2024
  headline: "We are hiring!"
  details: >
    We have several funded PhD positions available, through Heriot-Watt's own PhD School, or through the new Centre for Doctoral Training in [Applied Quantum Technologies](https://www.aqt.ac.uk/).  
    Get in touch if you are interested!  

    For more information, see the [Heriot-Watt PhD School](https://www.hw.ac.uk/study/postgraduate/phd-study.htm) or the [AQT CDT](https://www.aqt.ac.uk/).

- date: 12. November 2024
  headline: "European quantum light tour to be hosted at Scotland's Heriot-Watt University"
  details: >
    A quantum light source that's travelling across 12 countries in Europe with UNESCO has arrived at Heriot-Watt University – its only Scottish stop on the tour!  
    We're excited to share that our Edinburgh campus is hosting the QuanTour – which aims to raise interest in quantum physics ahead of next year's UNESCO International Year of Quantum Science and Technology 2025.  

    ![image](/images/newspic/QuanTour-1.png){:class='img-responsive'}  

    The QuanTour arrived at our Quantum Photonics Lab (QPL) yesterday which is led by Professor Brian Gerardot:  
    "We're very excited to be hosting the QuanTour light source. It's a great opportunity to connect with the research community in this area and also to celebrate the International Year of Quantum Science and Technology. Heriot-Watt has been at the forefront of this field of quantum optics for more than 25 years and a lot of the technology behind the quantum light source has been developed here and in the other laboratories taking part."  

    PhD students Fred and Sheena did a fantastic job of organising a traditional Scottish welcoming event for the QuanTour, which of course included piping in the quantum light source!

