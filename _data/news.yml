- date: 5. September 2025
  headline: "New Post-Docs!"
  details: >
    Welcome to our three new post-docs, all of whom are very familiar with the QPL group.  
    Dr. Art returns as a postdoctoral researcher to develop new fabrication capabilities and to fabricate novel two-dimensional materials and devices.  
    Sheena and Fred have completed their PhD theses and are now beginning postdoctoral research in engineering scalable photon-mediated interactions in semiconductor quantum dots and interfacing quantum dot single-photon sources with rare-earth ion doped quantum memories respectively.  
    A huge ‘welcome back’ to all of you!  

